name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    # Пока секреты не добавлены, workflow не стартует и не даёт красных сборок.
    if: ${{ vars.CLOUDFLARE_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Тесты перед выкладкой
        run: |
          python -m pip install -e . pytest
          python -m pytest -q

      - name: Сборка Worker-бандла
        run: python scripts/build_worker.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Гарантировать базу D1
        id: d1
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          existing=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/d1/database" \
            | jq -r '.result[]? | select(.name == "takt-db") | .uuid' | head -n 1)
          if [ -z "$existing" ]; then
            existing=$(curl -fsS -X POST \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/d1/database" \
              -d '{"name":"takt-db"}' | jq -r '.result.uuid')
          fi
          test -n "$existing"
          echo "id=$existing" >> "$GITHUB_OUTPUT"

      - name: Привязать D1 к Worker
        run: sed -i "s/REPLACE_WITH_D1_ID/${{ steps.d1.outputs.id }}/" wrangler.toml

      - name: Выкладка Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      - name: Секреты и Telegram webhook
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          set -euo pipefail
          for name in TELEGRAM_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET AI_BASE_URL AI_API_KEY; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx --yes wrangler@latest secret put "$name"
            fi
          done
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_WEBHOOK_SECRET:-}" ]; then
            sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
              | jq -r '.result.subdomain')
            url="https://takt.$sub.workers.dev/telegram/$TELEGRAM_WEBHOOK_SECRET"
            curl -fsS "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/setWebhook?url=$url" >/dev/null
            echo "Telegram webhook обновлён"
          fi

      - name: Проверка здоровья после выкладки
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | jq -r '.result.subdomain')
          url="https://takt.$sub.workers.dev"
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 15 "$url/api/health"; then
              echo "Такт жив: $url"
              exit 0
            fi
            sleep 10
          done
          echo "Такт не ответил после выкладки"
          exit 1
