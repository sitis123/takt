name: Smoke

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check public health
        run: |
          for attempt in 1 2 3; do
            if curl -fsS --max-time 10 "${{ secrets.PUBLIC_HEALTH_URL }}"; then
              echo "Такт доступен"
              exit 0
            fi
            sleep 10
          done
          echo "Такт недоступен"
          exit 1
      - name: Notify Telegram
        if: failure()
        run: |
          curl -fsS -X POST "https://api.telegram.org/bot${{ secrets.ALERT_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.ALERT_CHAT_ID }}" \
            --data-urlencode "text=Такт недоступен: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
