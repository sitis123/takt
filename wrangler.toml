name = "takt"
main = "worker/dist/takt-worker.js"
compatibility_date = "2024-06-01"
# Первичный вариант без домена: workers.dev. Домен можно добавить позже в Cloudflare Dashboard.

[[d1_databases]]
binding = "DB"
database_name = "takt-db"
database_id = "REPLACE_WITH_D1_ID"

[triggers]
crons = ["*/5 * * * *"]
